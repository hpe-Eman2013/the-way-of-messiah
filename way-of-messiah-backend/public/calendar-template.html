<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{MONTH}} {{YEAR}} - Enoch 364 Day Calendar</title>
  <link rel="stylesheet" href="/calendar-styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
    }
    header {
      background: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    header h1 {
      margin: 0;
      font-size: 1.4em;
      text-align: center;
    }
    .calendar-container {
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: #ddd;
      font-weight: bold;
      text-align: center;
      border: 1px solid #ccc;
      border-bottom: none;
    }
    .calendar-header > div {
      padding: 5px 0;
      height: 30px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid #ccc;
      border-top: none;
    }
    .calendar-grid > div {
      border: 1px solid #ccc;
      min-height: 100px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }
    .calendar-grid > div.empty {
      background-color: #eee;
    }
    .calendar-grid > div.sabbath {
      background-color: #ffeeaa;
    }
    .calendar-grid > div.feast {
      background-color: #ffcccc;
    }
    .calendar-grid > div span.day-number {
      font-weight: bold;
    }
    .calendar-grid > div span.enoch-day {
      font-size: 0.9em;
      color: #333;
    }
    .calendar-grid > div span.label {
      margin-top: 5px;
      font-size: 0.9em;
      font-style: italic;
    }
    .explanation {
      max-width: 800px;
      margin-left: 10px;
      font-size: 0.9em;
    }
    .explanation h4 {
      margin-top: 1.2em;
      margin-bottom: 0.4em;
    }
  </style>
</head>
<body>
  <header>
    <h1>CONSECRATED DAYS OF YAHUAH</h1>
  </header>
  <div class="calendar-container">
    <h2>{{MONTH}} {{YEAR}} - Enoch 364 Day Calendar</h2>
    <div class="calendar-header">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div class="calendar-grid">
      {{DAY_CELLS}}
    </div>
    <div class="explanation">
      <h3>Explanations for Set-Apart Days</h3>
      {{EXPLANATION}}
    </div>
  </div>
</body>
</html>
